<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forrest County Sheriff's Office - Home</title>
    <style>
        :root {
            --dark-forrest-green: #0a2e14;
            --gold-accent: #cf9f4d;
            --text-light: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--dark-forrest-green);
            color: var(--text-light);
        }

        /* Top Header Area */
        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
            background-color: var(--dark-forrest-green);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-img {
            width: 50px;
            height: 50px;
            object-fit: contain;
        }

        .logo-area h1 {
            margin: 0;
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        /* Navigation Bar */
        nav {
            background-color: var(--dark-forrest-green);
            padding: 15px 0;
            display: flex;
            justify-content: center;
            gap: 25px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        nav a {
            color: var(--text-light);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
        }

        nav a:hover {
            color: var(--gold-accent);
        }

        /* Hero Photo Background Section */
        .hero {
            height: 450px;
            background-image: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('background.png');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
        }

        .hero h2 {
            font-size: 3rem;
            margin: 0 0 10px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
        }

        .hero p {
            font-size: 1.2rem;
            color: var(--gold-accent);
            font-weight: bold;
            margin: 0;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.6);
        }
    </style>
</head>
<body>

    <header>
        <div class="top-header">
            <div class="logo-area">
                <img src="logo.png" alt="FCSO Logo" class="logo-img" onerror="this.style.display='none'">
                <h1>Forrest County<br>Sheriff's Office</h1>
            </div>
        </div>
        <nav>
            <a href="index.html">Home</a>
            <a href="open-positions.html">Open Positions</a>
            <a href="public-safety.html">Public Safety Division</a>
            <a href="jail-operations.html">Jail Operations</a>
            <a href="visitor-info.html">Visitor Information</a>
            <a href="civil-process.html">Civil Process</a>
            <a href="database.html" style="color: var(--gold-accent);">LEO Database 🔒</a>
        </nav>
    </header>

    <div class="hero">
        <h2>To Protect and Serve</h2>
        <p>Official Portal of the Forrest County Sheriff's Office</p>
    </div>

</body>
</html>
