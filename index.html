<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forrest County Sheriff's Office</title>
    <style>
        :root {
            --forrest-green: #114b21; /* Rich dark green */
            --nav-green: #0d3818;
            --gold-accent: #cf9f4d; /* Tan/Gold from the screenshot */
            --text-light: #ffffff;
            --bg-light: #f4f6f8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--forrest-green);
            color: var(--text-light);
        }

        /* Top Header Area */
        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
            background-color: var(--forrest-green);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-area h1 {
            margin: 0;
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .social-icons {
            display: flex;
            gap: 15px;
            font-weight: bold;
            letter-spacing: 2px;
            font-size: 1.2rem;
        }

        /* Navigation Bar */
        nav {
            background-color: var(--forrest-green);
            padding: 15px 0;
            display: flex;
            justify-content: center;
            gap: 25px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        nav a {
            color: var(--text-light);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        nav a:hover {
            color: var(--gold-accent);
        }

        .nav-arrow {
            font-size: 0.7rem;
        }

        /* Hero Carousel Section */
        .hero {
            height: 400px;
            background-color: #555;
            background-image: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url('https://images.unsplash.com/photo-1541888062837-775b83870b22?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            position: relative;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 20px;
        }

        .carousel-controls {
            background: rgba(255, 255, 255, 0.7);
            padding: 8px 15px;
            border-radius: 20px;
            display: flex;
            gap: 10px;
            align-items: center;
            color: #000;
            font-weight: bold;
        }

        .dot {
            width: 10px;
            height: 10px;
            border: 2px solid #000;
            border-radius: 50%;
            display: inline-block;
        }
        .dot.active { background-color: #000; }

        /* Join Our Team Section */
        .join-team {
            padding: 50px 20px;
            text-align: center;
        }

        .join-team h2 {
            font-size: 2rem;
            margin-bottom: 40px;
        }

        .icon-grid {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 40px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .icon-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 140px;
            text-decoration: none;
            color: white;
        }

        .icon-box {
            background-color: var(--gold-accent);
            width: 100px;
            height: 100px;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
            font-size: 3rem;
            color: white;
            transition: transform 0.2s;
        }

        .icon-item:hover .icon-box {
            transform: scale(1.05);
            background-color: #dfb260;
        }

        .icon-item span {
            font-weight: 600;
            font-size: 0.9rem;
            line-height: 1.3;
        }

    </style>
</head>
<body>

    <header>
        <div class="top-header">
            <div class="logo-area">
                <!-- Mock Star Badge -->
                <div style="width:30px; height:30px; background:var(--gold-accent); clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);"></div>
                <h1>Forrest County<br>Sheriff's Office</h1>
            </div>
            <div class="social-icons">
                🔍 🍎 G ⓕ 𝕏 📷
            </div>
        </div>
        <nav>
            <a href="index.html">Contact Us</a>
            <a href="services.html">Public Safety Division <span class="nav-arrow">▼</span></a>
            <a href="services.html">Jail Operations <span class="nav-arrow">▼</span></a>
            <a href="services.html">Visitor Information <span class="nav-arrow">▼</span></a>
            <a href="services.html">Civil Process <span class="nav-arrow">▼</span></a>
            <a href="database.html" style="color: var(--gold-accent);">LEO Database <span class="nav-arrow">🔒</span></a>
        </nav>
    </header>

    <div class="hero">
        <div class="carousel-controls">
            <span>⏸</span>
            <span class="dot"></span>
            <span class="dot active"></span>
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
        </div>
    </div>

    <section class="join-team">
        <h2>Join Our Team</h2>
        <div class="icon-grid">
            <a href="#" class="icon-item">
                <div class="icon-box">👥</div>
                <span>Open Positions</span>
            </a>
            <a href="#" class="icon-item">
                <div class="icon-box">📝</div>
                <span>Application</span>
            </a>
            <a href="#" class="icon-item">
                <div class="icon-box">💲</div>
                <span>Benefits</span>
            </a>
            <a href="#" class="icon-item">
                <div class="icon-box">👤</div>
                <span>Internships</span>
            </a>
            <a href="#" class="icon-item">
                <div class="icon-box">⭐</div>
                <span>Employment:<br>Corrections</span>
            </a>
        </div>
        <div class="icon-grid" style="margin-top: 40px;">
            <a href="#" class="icon-item">
                <div class="icon-box">📋</div>
                <span>Employment:<br>Non-Uniform</span>
            </a>
        </div>
    </section>

</body>
</html>
